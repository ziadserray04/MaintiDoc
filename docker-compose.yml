# Services de la démo complète. NON validé dans l'environnement de développement (pas de daemon Docker).
# Les secrets viennent du fichier .env (jamais committé) : voir .env.example.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: maintidoc
      POSTGRES_USER: ${POSTGRES_USER:?définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir dans .env}
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?définir dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?définir dans .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  qdrant_data:
  pg_data:
  minio_data:
