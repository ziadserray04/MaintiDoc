[project]
name = "maintidoc"
version = "0.1.0"
description = "Assistant documentaire multimodal et agentique pour la maintenance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3",
  "langgraph>=1.0", "qdrant-client>=1.12", "pymupdf>=1.24", "mcp>=1.0",
  "pyyaml>=6", "httpx>=0.27", "pyjwt>=2.8", "sqlalchemy>=2.0", "minio>=7.2", "psycopg2-binary>=2.9", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
ui = ["streamlit>=1.35"]
gpu = ["torch", "transformers", "sentence-transformers", "mlflow"]

[tool.pytest.ini_options]
markers = [
  "docker: nécessite les services réels (Qdrant/PostgreSQL/MinIO)",
  "gpu: nécessite un GPU ou un modèle volumineux",
]
addopts = "-m 'not docker and not gpu'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
